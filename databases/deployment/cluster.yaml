apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: data-cluster
  namespace: database
spec:
  instances: 3
  storage:
    size: 1Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
      volumeMode: Filesystem
